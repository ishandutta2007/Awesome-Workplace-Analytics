<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pulsing Dynamic Wave Background Elements -->
    <style>
      @keyframes waveFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes barGrow {
        0%, 100% { height: 30px; y: 250px; }
        50% { height: 65px; y: 215px; }
      }
      .bg-wave { animation: waveFloat 8s ease-in-out infinite; transform-origin: center; }
      .glow-orb { animation: pulseGlow 6s ease-in-out infinite; }
      .bar-anim-1 { animation: barGrow 4s ease-in-out infinite; }
      .bar-anim-2 { animation: barGrow 5s ease-in-out 1s infinite; }
      .bar-anim-3 { animation: barGrow 3.5s ease-in-out 0.5s infinite; }
    </style>
  </defs>

  <!-- Dark Rich Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs in Background (Behind Text) -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" class="glow-orb" filter="blur(60px)"/>
  <circle cx="1050" cy="280" r="200" fill="#ec4899" class="glow-orb" filter="blur(70px)"/>

  <!-- Animated Subtle Background Grid Waves -->
  <g opacity="0.15" class="bg-wave">
    <path d="M 0 100 Q 300 40 600 100 T 1200 100" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M 0 180 Q 300 240 600 180 T 1200 180" fill="none" stroke="#c084fc" stroke-width="2"/>
    <path d="M 0 260 Q 300 200 600 260 T 1200 260" fill="none" stroke="#f472b6" stroke-width="2"/>
  </g>

  <!-- Background Animated Dynamic Graph Bars (Low Opacity, Positioned to Sides) -->
  <g opacity="0.25">
    <rect x="70" y="220" width="18" height="60" rx="4" fill="#6366f1"/>
    <rect x="100" y="190" width="18" height="90" rx="4" fill="#818cf8"/>
    <rect x="130" y="240" width="18" height="40" rx="4" fill="#a855f7"/>

    <rect x="1040" y="210" width="18" height="70" rx="4" fill="#ec4899"/>
    <rect x="1070" y="170" width="18" height="110" rx="4" fill="#c084fc"/>
    <rect x="1100" y="230" width="18" height="50" rx="4" fill="#818cf8"/>
  </g>

  <!-- Center Decorative Glow Line -->
  <rect x="250" y="45" width="700" height="2" fill="url(#accentGrad)"/>
  <rect x="250" y="315" width="700" height="2" fill="url(#accentGrad)"/>

  <!-- FOREGROUND CONTENT: Clear, Bold Title and Subtitles (High Contrast & Visible) -->
  <!-- Top Badge -->
  <g transform="translate(480, 65)">
    <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="120" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">AWESOME CURATED LIST</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    Awesome Workplace Analytics 📊
  </text>

  <!-- Gradient Accent Line beneath Title -->
  <rect x="420" y="172" width="360" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="600" y="215" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle">
    Workforce Intelligence • Employee Productivity • Collaboration Insights
  </text>

  <!-- Key Feature Pills (Foreground) -->
  <g transform="translate(320, 248)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="85" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">💼 10+ SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="280" y="23" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ 15+ Open-Source</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="475" y="23" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📈 Market Intelligence</text>
  </g>
</svg>
